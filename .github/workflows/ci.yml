name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/

      - name: Run Tier 2 MR Fluid Benchmark
        run: |
          python implementations/v2_magnetorheological_fluid/mr_suspension_benchmark.py

      - name: Run Tier 3 PINN-HOCBF Preview NMPC
        run: |
          python implementations/v3_edge_pinn_preview_nmpc/differentiable_hocbf_nmpc.py
